# mihomo 分流配置（电脑 / 手机 / OpenWrt 通用）
# 用法见 README.md。要改的地方都标了「改这里」。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "rule-set:private_domain,cn_domain"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]

# 机场订阅由设备自己去拉（只许大陆访问的机场也能用）
x-airport: &airport
  type: http
  proxy: DIRECT
  interval: 3600
  exclude-filter: "(?i)剩余|到期|过期|流量|官网|网址|套餐|重置|客服|群|建议|超时|更新订阅|expire|traffic"
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 600
    lazy: true

# 改这里：机场名单。只有两家就删掉 机场3，同时删掉下面对应的 provider 和「✈️ 机场3」
x-airports: &airports [机场1, 机场2, 机场3]

proxy-providers:
  # 改这里：把链接换成你的机场订阅（Clash / mihomo 格式），前缀随便起，用来区分节点
  机场1:
    <<: *airport
    url: "https://换成你的订阅链接-1"
    path: ./providers/airport1.yaml
    override: { additional-prefix: "[机场1] " }
  机场2:
    <<: *airport
    url: "https://换成你的订阅链接-2"
    path: ./providers/airport2.yaml
    override: { additional-prefix: "[机场2] " }
  机场3:
    <<: *airport
    url: "https://换成你的订阅链接-3"
    path: ./providers/airport3.yaml
    override: { additional-prefix: "[机场3] " }
  # TAG（AI 专用机场）：不要手改这一段，用 tag.py 导入，见 README
  # >>> TAG
  TAG:
    type: inline
    payload: []
  # <<< TAG

# 地区组：中文名、国旗、或前后不挨字母的两位代码都能认出
# 超过 1x 的高倍率节点不进自动选择和地区组，免得悄悄费流量（各机场自己的组里还能手动选）
x-region: &region
  type: url-test
  use: *airports
  exclude-filter: "(?i)(?:^|[^0-9.])(?:[2-9]|[1-9][0-9]+|1\\.[0-9]*[1-9])(?:\\.[0-9]+)? ?(?:x|×|倍)"
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true

x-pick: &pick
  type: select
  proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🌍 其他地区, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3, DIRECT]

# AI 组：Claude 风控最严，默认走 TAG；没有 TAG 的话在 Clash 里把它切到 🇺🇸 美国
x-ai: &ai
  type: select
  proxies: [🏷️ TAG, 🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇹🇼 台湾, 🇭🇰 香港, 🌍 其他地区, ♻️ 自动选择, 🚀 节点选择, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3, DIRECT]

x-gpt: &gpt
  type: select
  proxies: [🇸🇬 新加坡, 🏷️ TAG, 🇺🇸 美国, 🇯🇵 日本, 🇹🇼 台湾, 🇭🇰 香港, 🌍 其他地区, ♻️ 自动选择, 🚀 节点选择, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3, DIRECT]

proxy-groups:
  - { name: 🚀 节点选择, type: select, proxies: [♻️ 自动选择, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🌍 其他地区, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3, DIRECT] }
  # 自动选择只挑港/台/日/新/美的 1x 及以下节点
  - { name: ♻️ 自动选择, type: url-test, use: *airports, filter: "港|台湾|台灣|日本|东京|大阪|新加坡|狮城|美国|美國|洛杉矶|圣何塞|硅谷|🇭🇰|🇹🇼|🇯🇵|🇸🇬|🇺🇸|(?:^|[^A-Za-z])(?:HK|TW|JP|SG|USA?)(?:[^A-Za-z]|$)|(?i)hong ?kong|taiwan|japan|tokyo|singapore|united ?states|los angeles", exclude-filter: "(?i)(?:^|[^0-9.])(?:[2-9]|[1-9][0-9]+|1\\.[0-9]*[1-9])(?:\\.[0-9]+)? ?(?:x|×|倍)", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 50, lazy: true }
  - { name: 📋 全部节点, type: select, use: *airports }
  # 只留日本家宽：IP 干净、像普通家庭用户。挑一个固定用，别来回换
  - { name: 🏷️ TAG, type: select, use: [TAG], filter: "日本家宽" }
  - { name: ✈️ 机场1, type: select, use: [机场1] }
  - { name: ✈️ 机场2, type: select, use: [机场2] }
  - { name: ✈️ 机场3, type: select, use: [机场3] }

  - { name: 🤖 OpenAI, <<: *gpt }
  - { name: 🧠 Claude, <<: *ai }
  - { name: ✨ Gemini, <<: *gpt }
  - { name: 🦾 其他AI, <<: *ai }
  - { name: 🔍 Google, <<: *pick }
  - { name: 📺 YouTube, <<: *pick }
  - { name: 🎬 Netflix, <<: *pick }
  - { name: 🎞️ 其他流媒体, <<: *pick }
  - { name: ✈️ Telegram, <<: *pick }
  - { name: 💬 Discord, <<: *pick }
  - { name: 🐱 GitHub, <<: *pick }
  - { name: 🎮 游戏, <<: *pick }
  - { name: Ⓜ️ 微软, type: select, proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国, 🇯🇵 日本, 🇭🇰 香港, 🇸🇬 新加坡, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3] }
  - { name: 🍎 苹果, type: select, proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国, 🇯🇵 日本, 🇭🇰 香港, 🇸🇬 新加坡, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3] }
  # 自己的服务器：默认直连省流量，卡了再在组里换成美国节点
  - { name: 🖥️ 我的服务器, type: select, proxies: [DIRECT, 🇺🇸 美国], use: *airports, filter: "美国|美國|🇺🇸|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)" }
  - { name: 🛑 广告拦截, type: select, proxies: [REJECT, DIRECT] }
  - { name: 🏠 国内, type: select, proxies: [DIRECT, 🚀 节点选择, 🇭🇰 香港] }
  - { name: 🐟 漏网之鱼, type: select, proxies: [🚀 节点选择, DIRECT, ♻️ 自动选择, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 📋 全部节点, ✈️ 机场1, ✈️ 机场2, ✈️ 机场3] }

  - { name: 🇭🇰 香港, <<: *region, filter: "港|🇭🇰|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)|(?i)hong ?kong" }
  - { name: 🇹🇼 台湾, <<: *region, filter: "台湾|台灣|🇹🇼|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)|(?i)taiwan" }
  - { name: 🇯🇵 日本, <<: *region, filter: "日本|东京|大阪|🇯🇵|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$)|(?i)japan|tokyo|osaka" }
  - { name: 🇸🇬 新加坡, <<: *region, filter: "新加坡|狮城|🇸🇬|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$)|(?i)singapore" }
  - { name: 🇺🇸 美国, <<: *region, filter: "美国|美國|洛杉矶|圣何塞|硅谷|纽约|西雅图|🇺🇸|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|(?i)united ?states|america|los angeles|san jose" }
  - { name: 🌍 其他地区, <<: *region, exclude-filter: "(?:^|[^0-9.])(?:[2-9]|[1-9][0-9]+|1\\.[0-9]*[1-9])(?:\\.[0-9]+)? ?(?:x|×|倍)|港|🇭🇰|(?:^|[^A-Za-z])(?:HK|TW|JP|SG|USA?)(?:[^A-Za-z]|$)|台湾|台灣|🇹🇼|日本|东京|大阪|🇯🇵|新加坡|狮城|🇸🇬|美国|美國|洛杉矶|圣何塞|硅谷|纽约|西雅图|🇺🇸|(?i)hong ?kong|taiwan|japan|tokyo|osaka|singapore|united ?states|america|los angeles|san jose" }

x-site: &site
  type: http
  behavior: domain
  format: mrs
  interval: 86400
  proxy: DIRECT
x-ip: &ip
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400
  proxy: DIRECT

