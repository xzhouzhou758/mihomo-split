# 从上往下匹配，先命中先生效：具体的服务放前面，宽泛的放后面
rules:
  - RULE-SET,private_domain,DIRECT
  # Claude 桌面版整个进程都走 Claude 组（只对电脑有效）；网页版用到的第三方服务，跟 Claude 走同一个出口，免得 IP 不一致触发风控
  - PROCESS-NAME-REGEX,^Claude( Helper.*)?$,🧠 Claude
  - DOMAIN,challenges.cloudflare.com,🧠 Claude
  - DOMAIN-SUFFIX,hcaptcha.com,🧠 Claude
  - DOMAIN-SUFFIX,datadoghq.com,🧠 Claude
  - DOMAIN-SUFFIX,stripe.com,🧠 Claude
  - DOMAIN-SUFFIX,stripe.network,🧠 Claude
  - DOMAIN-SUFFIX,intercom.io,🧠 Claude
  - DOMAIN-SUFFIX,intercomcdn.com,🧠 Claude
  - DOMAIN-SUFFIX,intercomassets.com,🧠 Claude
  - DOMAIN-SUFFIX,sentry.io,🧠 Claude
  - DOMAIN-SUFFIX,segment.io,🧠 Claude
  - DOMAIN-SUFFIX,segment.com,🧠 Claude
  - RULE-SET,ads,🛑 广告拦截
  # 自己的服务器：把 example.com 换成你的域名或 IP，可以复制多行
  - DOMAIN-SUFFIX,example.com,🖥️ 我的服务器
  # - IP-CIDR,1.2.3.4/32,🖥️ 我的服务器,no-resolve
  - RULE-SET,anthropic,🧠 Claude
  - RULE-SET,openai,🤖 OpenAI
  - RULE-SET,gemini,✨ Gemini
  - RULE-SET,ai,🦾 其他AI
  - RULE-SET,youtube,📺 YouTube
  - RULE-SET,google,🔍 Google
  - RULE-SET,netflix,🎬 Netflix
  - RULE-SET,disney,🎞️ 其他流媒体
  - RULE-SET,hbo,🎞️ 其他流媒体
  - RULE-SET,primevideo,🎞️ 其他流媒体
  - RULE-SET,spotify,🎞️ 其他流媒体
  - RULE-SET,tiktok,🎞️ 其他流媒体
  - RULE-SET,discord,💬 Discord
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,github,🐱 GitHub
  - RULE-SET,steam_cn,🏠 国内
  - RULE-SET,games_cn,🏠 国内
  - RULE-SET,games,🎮 游戏
  - RULE-SET,microsoft,Ⓜ️ 微软
  - RULE-SET,apple,🍎 苹果
  - RULE-SET,proxy_domain,🚀 节点选择
  - RULE-SET,cn_domain,🏠 国内
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,google_ip,🔍 Google,no-resolve
  - RULE-SET,netflix_ip,🎬 Netflix,no-resolve
  - RULE-SET,telegram_ip,✈️ Telegram,no-resolve
  - RULE-SET,cn_ip,🏠 国内
  - MATCH,🐟 漏网之鱼
